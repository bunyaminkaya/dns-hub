name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/test_core.py
          python tests/test_controller.py
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name DNSHub
          --icon assets\icon.ico
          --add-data "dnshub\providers.json;dnshub"
          --add-data "dnshub\locales;dnshub\locales"
          --collect-submodules dns
          --hidden-import h2 --hidden-import hpack --hidden-import hyperframe
          run.py
      - name: Checksum
        shell: pwsh
        run: (Get-FileHash dist\DNSHub.exe -Algorithm SHA256).Hash.ToLower() + "  DNSHub.exe" | Out-File -Encoding ascii dist\DNSHub.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: DNSHub
          path: dist/DNSHub.exe*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DNSHub.exe
            dist/DNSHub.exe.sha256
          generate_release_notes: true
